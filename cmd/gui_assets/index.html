<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Glass UI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 10%, #1f2a44 0%, #0a0f1f 35%, #05070f 100%);
      color: #f4f6ff;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .shell {
      width: min(980px, 100%);
      border-radius: 28px;
      padding: 24px;
      background: linear-gradient(140deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(26px) saturate(160%);
      -webkit-backdrop-filter: blur(26px) saturate(160%);
    }
    .row { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    .card {
      border-radius: 20px;
      padding: 18px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
    }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0; color: #d9dfff; }
    .controls { margin-top: 16px; display: grid; gap: 10px; }
    input, button {
      width: 100%; border: 0; border-radius: 14px; padding: 12px 14px; font-size: 14px;
    }
    input { background: rgba(255,255,255,.12); color: #fff; }
    button {
      background: linear-gradient(135deg, #72e5ff, #7b8dff);
      color: #071127; font-weight: 700; cursor: pointer;
    }
    pre { margin: 0; white-space: pre-wrap; max-height: 360px; overflow: auto; }
    .chip { display:inline-block; padding:6px 10px; border-radius:999px; background:rgba(114,229,255,.18); font-size:12px; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="row">
      <section class="card">
        <h1>Ollama Glass UI</h1>
        <p>Modern, intuitive interface for your local CLI runtime.</p>
        <div class="controls">
          <input id="model" placeholder="Model name (e.g. gemma3)" value="gemma3" />
          <input id="prompt" placeholder="Prompt" value="Summarize why local LLM workflows are useful." />
          <button id="run">Run Prompt</button>
        </div>
      </section>
      <section class="card">
        <span class="chip">Local API: http://localhost:11434</span>
        <pre id="output">Ready.</pre>
      </section>
    </div>
  </main>
<script>
const output = document.getElementById('output');
document.getElementById('run').addEventListener('click', async () => {
  const model = document.getElementById('model').value.trim();
  const prompt = document.getElementById('prompt').value.trim();
  if (!model || !prompt) return;
  output.textContent = 'Running...';
  try {
    const res = await fetch('http://localhost:11434/api/generate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({model, prompt, stream:false})
    });
    const data = await res.json();
    output.textContent = data.response || JSON.stringify(data, null, 2);
  } catch (err) {
    output.textContent = `Error: ${err.message}`;
  }
});
</script>
</body>
</html>
